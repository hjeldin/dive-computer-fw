[package]
name = "dive-computer-bootloader"
version = "0.1.0"
edition = "2024"

[dependencies]
dc-update-protocol = { path = "protocol" }
embassy-stm32 = { path = "../../embassy/embassy-stm32", features = ["defmt", "stm32l476rg", "unstable-pac"] }
embassy-boot-stm32 = { path = "../../embassy/embassy-boot-stm32", features = ["defmt"] }
embassy-embedded-hal = { path = "../../embassy/embassy-embedded-hal" }
embassy-sync = { path = "../../embassy/embassy-sync", features = ["defmt"] }
embassy-usb = { path = "../../embassy/embassy-usb", features = ["defmt"] }
embassy-futures = { path = "../../embassy/embassy-futures" }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "0.7.5"
defmt = "1.0.1"
defmt-rtt = "1.1.0"
panic-probe = { version = "0.3.2", features = ["defmt", "print-defmt"] }
embedded-storage = "0.3.1"

[[bin]]
name = "dive-computer-bootloader"
test = false
bench = false

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "z"
